<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13264b">
  <title>客戶詢問管理｜NorthGo</title>
  <style>
    :root{--navy:#13264b;--teal:#00aeb0;--ink:#192b43;--muted:#718094;--line:#e3e9ef;--paper:#f4f7fa;--white:#fff;--red:#bf4d4d;--green:#167a65;--shadow:0 18px 50px #13264b12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.bar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px)}.brand{font-size:1.35rem;font-weight:850;letter-spacing:-.04em;color:var(--navy);text-decoration:none}.brand b{color:var(--teal)}.bar-right{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:.86rem}.avatar{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:#e6f6f5;color:#087d87;font-weight:800}.page{width:min(1200px,calc(100% - 36px));margin:36px auto 70px}.eyebrow{color:#087e91;font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:7px 0 24px}.title-row h1{margin:0;color:var(--navy);font-size:clamp(1.8rem,3.5vw,2.45rem);line-height:1.2}.title-row p{margin:8px 0 0;color:var(--muted)}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border:1px solid transparent;border-radius:9px;padding:0 16px;background:var(--navy);color:#fff;font-weight:750}.button:hover{background:#203a70}.button.light{background:#fff;color:var(--navy);border-color:var(--line)}.button.light:hover{background:#f5fafb}.button.danger{background:#fff;color:var(--red);border-color:#f0d2d2}.button.small{min-height:34px;padding:0 11px;font-size:.84rem}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 19px;box-shadow:0 4px 18px #13264b06}.metric-label{font-size:.82rem;color:var(--muted)}.metric-value{font-size:1.8rem;font-weight:800;color:var(--navy);margin-top:4px}.metric.new .metric-value{color:#bb7822}.metric.progress .metric-value{color:#377eac}.metric.done .metric-value{color:var(--green)}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:17px 18px;border-bottom:1px solid var(--line)}.filters{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}.filters input,.filters select{min-height:40px;border:1px solid #d6e0e8;border-radius:8px;padding:8px 11px;background:#fff;color:var(--ink);outline:none}.filters input{width:min(360px,100%)}.filters input:focus,.filters select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #00aeb019}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #edf0f4;vertical-align:middle}th{font-size:.76rem;letter-spacing:.04em;color:#7d8a99;background:#fafbfd;font-weight:800;white-space:nowrap}td{font-size:.9rem}tbody tr:hover{background:#f9fbfc}.company{font-weight:750;color:var(--navy)}.sub{display:block;color:var(--muted);font-size:.79rem;margin-top:3px}.status{border:0;border-radius:999px;padding:6px 10px;font-size:.77rem;font-weight:800;background:#fff3dd;color:#9b6815}.status.in_progress{background:#e8f3fa;color:#2d6f98}.status.completed{background:#e4f5ef;color:#14715b}.status.archived{background:#edf0f3;color:#667382}.row-actions{display:flex;gap:7px;white-space:nowrap}.empty,.notice{padding:30px 16px;text-align:center;color:var(--muted)}.notice{position:fixed;right:20px;bottom:20px;z-index:50;max-width:min(430px,calc(100% - 40px));background:var(--navy);color:#fff;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);display:none}.notice.error{background:#8f3030}.footer-note{margin-top:14px;color:#8491a0;font-size:.79rem}.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 15%,#daf2f1 0,transparent 32%),var(--paper)}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(25px,6vw,42px);box-shadow:0 24px 70px #13264b13}.login-card h1{font-size:2rem;color:var(--navy);margin:27px 0 8px}.login-card p{color:var(--muted);margin:0 0 25px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:.86rem;font-weight:750;color:var(--navy)}.field input,.field select,.field textarea{width:100%;border:1px solid #d6e0e8;border-radius:9px;padding:11px 12px;outline:none;background:#fff;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.login-card .button{width:100%;margin-top:6px;min-height:47px}.login-help{font-size:.76rem;color:#8b98a6;margin-top:16px}.error-text{color:var(--red);font-size:.84rem;min-height:1.3em;margin-top:9px}.modal-backdrop{position:fixed;inset:0;background:#0e1f3380;display:none;place-items:center;padding:18px;z-index:30}.modal-backdrop.open{display:grid}.modal{background:#fff;width:min(720px,100%);max-height:min(92vh,900px);overflow:auto;border-radius:16px;box-shadow:0 30px 100px #071a3580}.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:17px 22px;display:flex;justify-content:space-between;align-items:center;z-index:1}.modal-head h2{margin:0;color:var(--navy);font-size:1.22rem}.icon-button{width:36px;height:36px;border:0;border-radius:8px;background:#f2f5f7;color:#516172;font-size:1.25rem}.modal-body{padding:17px 22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.form-grid .wide{grid-column:1/-1}.service-options{display:flex;gap:10px 16px;flex-wrap:wrap}.service-options label{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}.service-options input{width:auto}.modal-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;gap:10px}.detail-meta{color:var(--muted);font-size:.8rem;margin-bottom:12px}.hide{display:none!important}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{height:64px}.page{margin-top:24px}}@media(max-width:520px){.metrics{gap:9px}.metric{padding:13px}.metric-value{font-size:1.5rem}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.toolbar{align-items:stretch}.filters{width:100%}.filters input{flex:1;min-width:170px}.title-row .button{width:100%}.modal-foot{flex-wrap:wrap}.modal-foot .button{flex:1}}
  </style>
</head>
<body>
  <section class="login-screen" id="login-screen" aria-labelledby="login-title"><form class="login-card" id="login-form"><a class="brand" href="index.html">North<b>Go</b></a><span class="eyebrow" style="display:block;margin-top:24px">ADMIN PORTAL</span><h1 id="login-title">後台登入</h1><p>登入後管理前台收到的貨運詢問。</p><div class="field"><label for="username">帳號</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">登入管理後台</button><div class="error-text" id="login-error" role="alert"></div><div class="login-help">課堂示範帳號：<code>admin</code>／密碼：<code>northgo-admin</code></div></form></section>
  <div class="shell hide" id="app"><header class="bar"><a class="brand" href="index.html">North<b>Go</b></a><div class="bar-right"><span id="user-label">管理者</span><span class="avatar" aria-hidden="true">N</span><button class="button light small" id="logout">登出</button></div></header>
    <main class="page"><span class="eyebrow">Customer enquiries</span><div class="title-row"><div><h1>客戶詢問</h1><p>集中查看前台送出的貨運需求，更新處理進度並維護聯絡資料。</p></div><button class="button" id="add-inquiry">＋ 新增詢問</button></div>
      <section class="metrics" aria-label="詢問統計"><article class="metric"><div class="metric-label">全部詢問</div><div class="metric-value" id="count-all">0</div></article><article class="metric new"><div class="metric-label">待處理</div><div class="metric-value" id="count-new">0</div></article><article class="metric progress"><div class="metric-label">處理中</div><div class="metric-value" id="count-progress">0</div></article><article class="metric done"><div class="metric-label">已完成</div><div class="metric-value" id="count-done">0</div></article></section>
      <section class="panel"><div class="toolbar"><div class="filters"><input id="search" type="search" placeholder="搜尋公司、聯絡人、Email 或電話" aria-label="搜尋詢問"><select id="status-filter" aria-label="依處理狀態篩選"><option value="">所有狀態</option><option value="new">待處理</option><option value="in_progress">處理中</option><option value="completed">已完成</option><option value="archived">封存</option></select></div><button class="button light small" id="refresh">重新整理</button></div><div class="table-wrap"><table><thead><tr><th>公司／聯絡人</th><th>服務與路線</th><th>聯絡方式</th><th>收到時間</th><th>狀態</th><th>管理</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">目前沒有符合條件的詢問。</div></div></section><p class="footer-note">詢問資料儲存在 Cloudflare D1；請依公司個資管理規範處理客戶資料。</p>
    </main>
  </div>
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><form class="modal" id="inquiry-form"><div class="modal-head"><h2 id="modal-title">新增詢問</h2><button class="icon-button" type="button" id="close-modal" aria-label="關閉">×</button></div><div class="modal-body"><div class="detail-meta" id="detail-meta"></div><div class="form-grid"><div class="field"><label for="first-name">名字 *</label><input id="first-name" name="first_name" required maxlength="80"></div><div class="field"><label for="last-name">姓氏 *</label><input id="last-name" name="last_name" required maxlength="80"></div><div class="field"><label for="company">公司 *</label><input id="company" name="company" required maxlength="160"></div><div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required maxlength="254"></div><div class="field"><label for="phone">電話 *</label><input id="phone" name="phone" type="tel" required maxlength="60"></div><div class="field"><label for="country">國家／地區</label><input id="country" name="country" maxlength="100"></div><div class="field wide"><label>詢問服務</label><div class="service-options"><label><input type="checkbox" name="services" value="Freight Logistics"> 貨運物流</label><label><input type="checkbox" name="services" value="Project Logistics"> 專案物流</label><label><input type="checkbox" name="services" value="Warehouse Logistics"> 倉儲物流</label><label><input type="checkbox" name="services" value="Shipping Agency"> 船務代理</label><label><input type="checkbox" name="services" value="Other"> 其他</label></div></div><div class="field wide"><label for="message">需求說明</label><textarea id="message" name="message" maxlength="4000"></textarea></div><div class="field wide"><label for="edit-status">處理狀態</label><select id="edit-status" name="status"><option value="new">待處理</option><option value="in_progress">處理中</option><option value="completed">已完成</option><option value="archived">封存</option></select></div></div></div><div class="modal-foot"><button class="button danger hide" id="delete-inquiry" type="button">刪除</button><div style="margin-left:auto;display:flex;gap:9px"><button class="button light" type="button" id="cancel-modal">取消</button><button class="button" type="submit">儲存</button></div></div></form></div>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <script src="api-config.js"></script>
  <script>
    (()=>{
      const API_BASE=(window.NORTHGO_API_BASE||location.origin).replace(/\/$/u,'');
      const tokenKey='northgo.admin.token';
      const loginScreen=document.querySelector('#login-screen'), app=document.querySelector('#app'), loginForm=document.querySelector('#login-form'), loginError=document.querySelector('#login-error'), rows=document.querySelector('#rows'), empty=document.querySelector('#empty'), notice=document.querySelector('#notice'), modal=document.querySelector('#modal'), form=document.querySelector('#inquiry-form');
      let token=sessionStorage.getItem(tokenKey)||'',editingId=null,allItems=[];
      const statusNames={new:'待處理',in_progress:'處理中',completed:'已完成',archived:'封存'};
      const esc=value=>String(value??'').replace(/[&<>"']/gu,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      function tell(message,isError=false){notice.textContent=message;notice.classList.toggle('error',isError);notice.style.display='block';clearTimeout(tell.timer);tell.timer=setTimeout(()=>notice.style.display='none',3600)}
      async function api(path,options={}){const headers=new Headers(options.headers||{});if(options.body)headers.set('Content-Type','application/json');if(token)headers.set('Authorization',`Bearer ${token}`);const response=await fetch(`${API_BASE}${path}`,{...options,headers});const data=response.status===204?{}:await response.json().catch(()=>({error:'伺服器回應格式錯誤。'}));if(response.status===401&&path!=='/api/login'){logout(false);throw new Error('登入已逾時，請重新登入。')}if(!response.ok)throw new Error(data.error||'操作失敗。');return data}
      function showApp(username){loginScreen.classList.add('hide');app.classList.remove('hide');document.querySelector('#user-label').textContent=username||'管理者'}
      function showLogin(){app.classList.add('hide');loginScreen.classList.remove('hide')}
      async function load(){const q=encodeURIComponent(document.querySelector('#search').value.trim()),status=encodeURIComponent(document.querySelector('#status-filter').value);const data=await api(`/api/inquiries?q=${q}&status=${status}&limit=100`);allItems=data.items||[];document.querySelector('#count-all').textContent=String(Object.values(data.counts||{}).reduce((a,b)=>a+Number(b),0));document.querySelector('#count-new').textContent=String(data.counts?.new||0);document.querySelector('#count-progress').textContent=String(data.counts?.in_progress||0);document.querySelector('#count-done').textContent=String(data.counts?.completed||0);render()}
      function render(){rows.replaceChildren();empty.style.display=allItems.length?'none':'block';for(const item of allItems){const tr=document.createElement('tr');const fullName=`${item.first_name||''} ${item.last_name||''}`.trim();const services=Array.isArray(item.services)?item.services.join('、'):'—';const route=esc(item.country||'');tr.innerHTML=`<td><span class="company">${esc(item.company)}</span><span class="sub">${esc(fullName)}</span></td><td>${esc(services||'—')}<span class="sub">${route}</span></td><td>${esc(item.email)}<span class="sub">${esc(item.phone)}</span></td><td>${esc(new Date(item.created_at).toLocaleString('zh-TW',{hour12:false}))}</td><td><select class="status ${esc(item.status)}" data-status-id="${Number(item.id)}" aria-label="${esc(fullName)}處理狀態">${Object.entries(statusNames).map(([value,label])=>`<option value="${value}" ${item.status===value?'selected':''}>${label}</option>`).join('')}</select></td><td><div class="row-actions"><button class="button light small" data-open-id="${Number(item.id)}" type="button">查看／編輯</button></div></td>`;rows.append(tr)}}
      function openModal(item=null){editingId=item?Number(item.id):null;form.reset();document.querySelector('#modal-title').textContent=item?'查看／編輯詢問':'新增詢問';document.querySelector('#detail-meta').textContent=item?`編號 #${item.id}　收到：${new Date(item.created_at).toLocaleString('zh-TW',{hour12:false})}`:'';document.querySelector('#delete-inquiry').classList.toggle('hide',!item);for(const field of ['first_name','last_name','company','email','phone','country','message'])form.elements[field].value=item?.[field]||'';const selected=Array.isArray(item?.services)?item.services:[];form.querySelectorAll('input[name="services"]').forEach(input=>input.checked=selected.includes(input.value));form.elements.status.value=item?.status||'new';modal.classList.add('open');document.querySelector('#first-name').focus()}
      function closeModal(){modal.classList.remove('open');editingId=null}
      function getFormData(){const data=Object.fromEntries(new FormData(form).entries());data.services=[...form.querySelectorAll('input[name="services"]:checked')].map(input=>input.value);data.status=form.elements.status.value;return data}
      async function logout(callApi=true){const old=token;token='';sessionStorage.removeItem(tokenKey);showLogin();if(callApi&&old){try{await fetch(`${API_BASE}/api/logout`,{method:'POST',headers:{Authorization:`Bearer ${old}`}})}catch{}}}
      loginForm.addEventListener('submit',async event=>{event.preventDefault();loginError.textContent='';try{const result=await api('/api/login',{method:'POST',body:JSON.stringify({username:loginForm.elements.username.value.trim(),password:loginForm.elements.password.value})});token=result.token;sessionStorage.setItem(tokenKey,token);loginForm.elements.password.value='';showApp(result.username);await load()}catch(error){loginError.textContent=error.message}});
      document.querySelector('#logout').addEventListener('click',()=>logout());document.querySelector('#refresh').addEventListener('click',()=>load().catch(error=>tell(error.message,true)));document.querySelector('#add-inquiry').addEventListener('click',()=>openModal());document.querySelector('#close-modal').addEventListener('click',closeModal);document.querySelector('#cancel-modal').addEventListener('click',closeModal);modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});
      rows.addEventListener('click',event=>{const button=event.target.closest('[data-open-id]');if(button){const item=allItems.find(row=>Number(row.id)===Number(button.dataset.openId));if(item)openModal(item)}});
      rows.addEventListener('change',async event=>{const select=event.target.closest('[data-status-id]');if(!select)return;try{await api(`/api/inquiries/${select.dataset.statusId}`,{method:'PATCH',body:JSON.stringify({status:select.value})});tell('詢問狀態已更新。');await load()}catch(error){tell(error.message,true);load().catch(()=>{})}});
      form.addEventListener('submit',async event=>{event.preventDefault();const data=getFormData();try{if(editingId)await api(`/api/inquiries/${editingId}`,{method:'PATCH',body:JSON.stringify(data)});else await api('/api/inquiries',{method:'POST',body:JSON.stringify(data)});closeModal();tell(editingId?'詢問資料已更新。':'已新增詢問。');await load()}catch(error){tell(error.message,true)}});
      document.querySelector('#delete-inquiry').addEventListener('click',async()=>{if(!editingId||!confirm('確定刪除這筆詢問？刪除後無法復原。'))return;try{await api(`/api/inquiries/${editingId}`,{method:'DELETE'});closeModal();tell('詢問已刪除。');await load()}catch(error){tell(error.message,true)}});
      let searchTimer;document.querySelector('#search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>load().catch(error=>tell(error.message,true)),250)});document.querySelector('#status-filter').addEventListener('change',()=>load().catch(error=>tell(error.message,true)));
      if(API_BASE==='__API_BASE__'){loginError.textContent='後端網址尚未設定。';loginForm.querySelector('button').disabled=true}else if(token){api('/api/me').then(user=>{showApp(user.username);return load()}).catch(()=>logout(false))}
    })();
  </script>
</body>
</html>
